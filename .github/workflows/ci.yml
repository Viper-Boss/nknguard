name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: race
        run: go test -race ./...
      - name: build linux-amd64 / linux-arm64 (core)
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/nknguard
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/nknguard

  windows:
    name: windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
      - name: test Windows adapters and client
        run: go test -tags "nknsdk libp2pdht" ./...
      - name: Windows resources (manifest for native controls, icon)
        working-directory: cmd/nknguard
        run: go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --manifest gui --icon winres/icon.png --product-name NKNGuard --file-description "NKNGuard Windows client" --original-filename NKNGuard-Windows.exe
      - name: build Windows app
        run: go build -tags "nknsdk libp2pdht" -trimpath -ldflags "-H=windowsgui -X main.guiBuild=1 -X github.com/Viper-Boss/nknguard/internal/app.Version=0.2.6-preview" -o NKNGuard-Windows.exe ./cmd/nknguard
      - name: build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          & $compiler packaging/windows/nknguard.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: smoke test install upgrade and uninstall
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "nknguard-install-test"
          $installer = (Resolve-Path dist/windows/NKNGuard-Setup-0.2.6-preview.exe).Path
          foreach ($iteration in 1..2) {
            $process = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$target`"") -PassThru -Wait -WindowStyle Hidden
            if ($process.ExitCode -ne 0 -or !(Test-Path "$target\NKNGuard-Windows.exe")) { throw "Install/upgrade failed" }
          }
          $process = Start-Process "$target\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or (Test-Path "$target\NKNGuard-Windows.exe")) { throw "Uninstall left application binary" }
      - name: upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: NKNGuard-Windows
          path: |
            NKNGuard-Windows.exe
            dist/windows/NKNGuard-Setup-0.2.6-preview.exe
          if-no-files-found: error

  full:
    name: full (nknsdk + libp2pdht)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
      - name: fetch optional modules
        run: make deps
      - name: vet with tags
        run: go vet -tags "nknsdk libp2pdht" ./...
      - name: test with tags
        run: go test -tags "nknsdk libp2pdht" ./...
      - name: build linux-amd64 / linux-arm64
        run: |
          GOOS=linux GOARCH=amd64 go build -tags "nknsdk libp2pdht" -o /dev/null ./cmd/nknguard
          GOOS=linux GOARCH=arm64 go build -tags "nknsdk libp2pdht" -o /dev/null ./cmd/nknguard
