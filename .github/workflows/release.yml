name: release

# Pushing a tag v* (or a branch release/v*, which becomes tag v*) builds
# every platform and prepares a draft for persistent APK and catalogue signing with the NAS/Linux
# daemons, the Windows client, the Android APK and SHA256SUMS. Release notes
# come from .github/RELEASE_NOTES.md.

on:
  push:
    tags: ["v*"]
    branches: ["release/v*"]

permissions:
  contents: read

jobs:
  linux:
    name: NAS / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: release tag
        shell: bash
        # v0.1.0-preview.2 from tag v0.1.0-preview.2 or branch release/v0.1.0-preview.2
        run: echo "TAG=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
      - name: test
        run: go test -race ./... && go test -tags "nknsdk libp2pdht" ./...
      - name: build
        run: |
          make release VERSION="$TAG"
          curl -fL --retry 3 https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o "$RUNNER_TEMP/fnpack"
          chmod +x "$RUNNER_TEMP/fnpack"
          FNPACK="$RUNNER_TEMP/fnpack" sh packaging/fnos/build.sh amd64 "$TAG" "$PWD/dist/nknguard-linux-amd64" dist
          FNPACK="$RUNNER_TEMP/fnpack" sh packaging/fnos/build.sh arm64 "$TAG" "$PWD/dist/nknguard-linux-arm64" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/nknguard-linux-*
            dist/*.fpk
          if-no-files-found: error

  windows:
    name: Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: release tag
        shell: bash
        # v0.1.0-preview.2 from tag v0.1.0-preview.2 or branch release/v0.1.0-preview.2
        run: echo "TAG=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
      - name: test
        run: go test -tags "nknsdk libp2pdht" ./...
      - name: Windows resources (manifest for native controls, icon)
        shell: bash
        working-directory: cmd/nknguard
        run: go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --manifest gui --icon winres/icon.png --product-name NKNGuard --file-description "NKNGuard Windows client" --original-filename NKNGuard-Windows.exe --copyright "(c) 2026 NKNGuard Authors, AGPL-3.0-only"
      - name: build
        shell: bash
        run: |
          version="$TAG"
          go build -tags "nknsdk libp2pdht" -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.guiBuild=1 -X github.com/Viper-Boss/nknguard/internal/app.Version=$version" \
            -o NKNGuard-Windows.exe ./cmd/nknguard
          mkdir -p pkg
          cp NKNGuard-Windows.exe LICENSE NOTICE pkg/
          cd pkg && 7z a ../NKNGuard-Windows-x86_64-preview.zip .
      - name: installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          & $compiler "/DAppVersion=$($env:TAG.TrimStart('v'))" packaging/windows/nknguard.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: native Windows launch smoke test
        shell: pwsh
        run: packaging/windows/smoke-ui.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            NKNGuard-Windows-x86_64-preview.zip
            dist/windows/NKNGuard-Setup-*.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: release tag
        shell: bash
        # v0.1.0-preview.2 from tag v0.1.0-preview.2 or branch release/v0.1.0-preview.2
        run: echo "TAG=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: build core (all ABIs)
        run: NKG_VERSION="$TAG" android/core/build.sh
      - name: build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -PskipGoCore=true
      - name: rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk UNSIGNED-NKNGuard-Android-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: UNSIGNED-NKNGuard-Android-preview.apk
          if-no-files-found: error

  publish:
    name: Prepare release for maintainer signing
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: release tag
        shell: bash
        # v0.1.0-preview.2 from tag v0.1.0-preview.2 or branch release/v0.1.0-preview.2
        run: echo "TAG=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" out/* \
            --draft --prerelease \
            --title "NKNGuard ${TAG#v}" \
            --notes-file .github/RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
