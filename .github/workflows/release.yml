name: release

# Pushing a tag v* builds every platform and publishes a GitHub pre-release
# with the NAS/Linux daemons, the Windows client, the Android APK and
# SHA256SUMS. Release notes come from .github/RELEASE_NOTES.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    name: NAS / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
      - name: test
        run: go test -race ./... && go test -tags "nknsdk libp2pdht" ./...
      - name: build
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/nknguard-linux-*
          if-no-files-found: error

  windows:
    name: Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
      - name: test
        run: go test -tags "nknsdk libp2pdht" ./...
      - name: build
        shell: bash
        run: |
          version=$(git describe --tags --always)
          go build -tags "nknsdk libp2pdht" -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.guiBuild=1 -X github.com/Viper-Boss/nknguard/internal/app.Version=$version" \
            -o NKNGuard-Windows.exe ./cmd/nknguard
          mkdir -p pkg
          cp NKNGuard-Windows.exe LICENSE NOTICE pkg/
          cd pkg && 7z a ../NKNGuard-Windows-preview.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: NKNGuard-Windows-preview.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: build core (all ABIs)
        run: NKG_VERSION=$(git describe --tags --always) android/core/build.sh
      - name: build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug -PskipGoCore=true
      - name: rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NKNGuard-Android-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: NKNGuard-Android-preview.apk
          if-no-files-found: error

  publish:
    name: Publish pre-release
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" out/* \
            --prerelease \
            --title "NKNGuard ${TAG#v}" \
            --notes-file .github/RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
