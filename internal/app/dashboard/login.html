<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1420">
  <title>登录 · NKNGuard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div><div class="ambient ambient-two" aria-hidden="true"></div>
  <main class="login-layout">
    <section class="welcome">
      <a class="brand" href="/login" aria-label="NKNGuard 登录首页"><span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 20 6v6c0 5-8 9-8 9s-8-4-8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></span><span>NKNGuard<small>让连接，更自由</small></span></a>
      <div class="welcome-copy"><div class="eyebrow"><span></span> 你的私人连接空间</div><h1>你的 NAS，<br>随时，<em>安全相连。</em></h1><p>无论身在何处，家里的文件和服务<br class="desktop-break">始终触手可及。</p></div>
      <div class="connection-art" aria-hidden="true">
        <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
        <svg class="connection-lines" viewBox="0 0 520 260" fill="none"><path class="track" d="M75 175C150 175 158 85 260 85S390 175 450 175"/><path class="signal" d="M75 175C150 175 158 85 260 85S390 175 450 175"/><path class="track" d="M75 175C150 175 175 220 260 220S390 175 450 175"/><path class="signal signal-two" d="M75 175C150 175 175 220 260 220S390 175 450 175"/></svg>
        <div class="device device-phone"><svg viewBox="0 0 32 40" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="2" width="18" height="35" rx="4"/><path d="M13 7h6M14 31h4"/></svg><span>你的设备</span></div>
        <div class="secure-node"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg><span>加密连接</span></div>
        <div class="device device-nas"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="7" y="4" width="26" height="31" rx="5"/><path d="M13 11h14M13 18h14M13 25h8"/><circle cx="27" cy="29" r="1" fill="currentColor"/></svg><span>家中的 NAS</span></div>
      </div>
      <div class="features"><span><i></i>直连优先</span><span><i></i>端到端加密</span><span><i></i>只连接你的 NAS</span></div>
    </section>
    <section class="login-card" aria-labelledby="login-title">
      <div class="card-top"><span class="card-kicker">管理后台</span><span class="private-badge"><span></span> 私有空间</span></div>
      <h2 id="login-title">欢迎回来<span>。</span></h2><p class="card-description">登录后，管理你的设备与连接。</p>
      <form id="login-form" method="post" action="/api/auth/login">
        <label for="username">用户名</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg><input id="username" name="username" placeholder="输入用户名" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64"></div>
        <div class="label-row"><label for="password">管理密码</label><span>使用你设置的密码</span></div><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" name="password" type="password" placeholder="输入管理密码" autocomplete="current-password" required autofocus><button type="button" id="show-password" class="visibility" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/><path class="eye-slash" d="m4 3 16 18"/></svg></button></div>
        <div id="login-message" class="form-message" role="status" aria-live="polite"></div>
        <button id="login-submit" class="submit" type="submit"><span class="submit-label">登录管理后台</span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg><span class="spinner" aria-hidden="true"></span></button>
      </form>
      <div class="card-footer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg><span>你的设备，你的连接，你的掌控。</span></div>
    </section>
    <footer class="page-footer"><span>NKNGuard · 安全连接，自由访问</span><span>为你的 NAS 而来</span></footer>
  </main>
</body>
</html>
